<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình phát video học ngoại ngữ</title>
    <style>
        /* ---------- RESET & TOÀN CỤC ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ---------- HEADER ---------- */
        .header {
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .header .brand {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #fff;
            margin-right: 12px;
        }
        .header .brand i {
            color: #ff4d4d;
        }
        .file-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
        }
        .file-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .file-btn:hover {
            background: #3a3a3a;
            border-color: #666;
            color: #fff;
        }
        .file-btn input[type="file"] {
            display: none;
        }
        .status {
            font-size: 0.85rem;
            color: #aaa;
            margin-left: auto;
            background: #1e1e1e;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #333;
            white-space: nowrap;
        }
        .status.ok {
            color: #6f6;
            border-color: #464;
        }
        .status.warn {
            color: #ff6;
            border-color: #664;
        }
        .status.err {
            color: #f66;
            border-color: #644;
        }

        /* ---------- MAIN LAYOUT ---------- */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 0;
        }
        .video-wrapper {
            flex: 2;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
        }
        .video-wrapper video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            background: #000;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            cursor: pointer;
        }
        /* Subtitle overlay trên video */
        .video-subtitle {
            position: absolute;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 4px #000;
            padding: 0 20px;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 8px;
            margin: 0 10%;
            transition: opacity 0.2s, font-size 0.1s, bottom 0.1s;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 1.6rem;
            bottom: 10%;
        }
        .video-subtitle.hidden {
            opacity: 0;
        }

        /* ---------- TRANSCRIPT (bên phải) ---------- */
        .transcript-wrapper {
            flex: 1;
            background: #151515;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            max-width: 45%;
            overflow: hidden;
        }
        .transcript-header {
            padding: 10px 16px;
            background: #1e1e1e;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .transcript-header span {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .transcript-header .subtitle-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        .transcript-header .subtitle-toggle input {
            width: 18px;
            height: 18px;
            accent-color: #ff4d4d;
            cursor: pointer;
        }
        .transcript-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scroll-behavior: smooth;
        }
        .transcript-list::-webkit-scrollbar {
            width: 6px;
        }
        .transcript-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .transcript-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        .transcript-item {
            padding: 6px 16px 6px 20px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .transcript-item:hover {
            background: #242424;
        }
        .transcript-item .ts {
            color: #888;
            font-feature-settings: "tnum";
            font-size: 0.8rem;
            min-width: 58px;
            padding-top: 1px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .transcript-item .text {
            color: #ddd;
            word-break: break-word;
        }
        .transcript-item.active {
            background: #2a2a3a;
            border-left-color: #ff4d4d;
        }
        .transcript-item.active .ts {
            color: #ff6f6f;
        }
        .transcript-item.active .text {
            color: #fff;
        }
        .transcript-empty {
            padding: 30px 20px;
            color: #666;
            text-align: center;
            font-size: 0.95rem;
        }

        /* ---------- CONTROLS (phía dưới) ---------- */
        .controls {
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            padding: 8px 20px 12px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-area .time {
            font-size: 0.8rem;
            color: #aaa;
            font-variant-numeric: tabular-nums;
            min-width: 70px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: #333;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: height 0.2s;
        }
        .progress-bar:hover {
            height: 8px;
        }
        .progress-bar .fill {
            height: 100%;
            background: #ff4d4d;
            border-radius: 10px;
            width: 0%;
            pointer-events: none;
        }
        .progress-bar input[type="range"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }
        .btn-group button {
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            font-family: inherit;
        }
        .btn-group button:hover {
            background: #2a2a2a;
            color: #fff;
        }
        .btn-group button:active {
            transform: scale(0.92);
        }
        .btn-group button.play-btn {
            font-size: 1.6rem;
            min-width: 48px;
            background: #2a2a2a;
            border-radius: 30px;
        }
        .btn-group button.play-btn:hover {
            background: #3a3a3a;
        }
        .btn-group .jump-group {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: 8px;
            background: #222;
            padding: 0 6px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        .btn-group .jump-group button {
            min-width: 24px;
            height: 28px;
            font-size: 1rem;
            padding: 0 4px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
        }
        .btn-group .jump-group button:hover {
            color: #fff;
            background: transparent;
        }
        .btn-group .jump-group input {
            width: 44px;
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 0.9rem;
            padding: 4px 0;
            text-align: center;
            outline: none;
            font-weight: 500;
        }
        .btn-group .jump-group input:focus {
            background: #2a2a2a;
        }
        .btn-group .jump-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .btn-group .jump-group input[type="number"] {
            -moz-appearance: textfield;
        }
        .btn-group .jump-group label {
            font-size: 0.75rem;
            color: #888;
            margin-left: 2px;
        }
        .btn-group .sep {
            width: 1px;
            height: 28px;
            background: #333;
            margin: 0 4px;
        }
        .btn-group .subtitle-toggle-btn {
            font-size: 0.9rem;
            background: #222;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 0 14px;
            height: 32px;
            color: #aaa;
        }
        .btn-group .subtitle-toggle-btn.active {
            border-color: #ff4d4d;
            color: #fff;
        }
        .btn-group .subtitle-ctrl-btn {
            font-size: 0.9rem;
            min-width: 32px;
            height: 30px;
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            color: #ccc;
            padding: 0 6px;
        }
        .btn-group .subtitle-ctrl-btn:hover {
            background: #333;
            color: #fff;
        }

        @media (max-width: 820px) {
            .main { flex-direction: column; }
            .transcript-wrapper { max-width: 100%; border-left: none; border-top: 1px solid #2a2a2a; height: 40vh; }
            .video-wrapper video { max-height: 50vh; }
            .video-subtitle { font-size: 1.2rem; bottom: 5%; margin: 0 5%; }
            .header .status { margin-left: 0; width: 100%; }
            .btn-group button { font-size: 1rem; min-width: 32px; height: 32px; }
            .btn-group button.play-btn { font-size: 1.4rem; min-width: 42px; }
            .btn-group .jump-group input { width: 36px; }
        }
        @media (max-width: 500px) {
            .header .brand { font-size: 1rem; }
            .file-btn { font-size: 0.8rem; padding: 4px 12px; }
            .controls { padding: 6px 10px 10px; }
            .btn-group { gap: 4px; }
            .btn-group .jump-group { padding: 0 4px; }
            .btn-group .jump-group input { width: 30px; font-size: 0.8rem; }
            .btn-group .subtitle-ctrl-btn { font-size: 0.8rem; min-width: 28px; height: 26px; padding: 0 4px; }
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="brand">🎧 <span>LangPlayer</span></div>
        <div class="file-group">
            <label class="file-btn">
                📁 Chọn video
                <input type="file" id="videoInput" accept="video/*">
            </label>
            <label class="file-btn">
                📄 Chọn phụ đề (.srt)
                <input type="file" id="srtInput" accept=".srt,text/plain">
            </label>
        </div>
        <div class="status" id="status">Chưa có video</div>
    </header>

    <!-- ========== MAIN ========== -->
    <div class="main">
        <div class="video-wrapper">
            <video id="videoPlayer" controlslist="nodownload noremoteplayback" playsinline></video>
            <div class="video-subtitle hidden" id="videoSubtitle"></div>
        </div>
        <div class="transcript-wrapper">
            <div class="transcript-header">
                <span>📝 Transcript</span>
                <div class="subtitle-toggle">
                    <label for="subtitleToggle">Phụ đề</label>
                    <input type="checkbox" id="subtitleToggle" checked>
                </div>
            </div>
            <div class="transcript-list" id="transcriptList">
                <div class="transcript-empty">Chưa có phụ đề</div>
            </div>
        </div>
    </div>

    <!-- ========== CONTROLS ========== -->
    <div class="controls">
        <div class="progress-area">
            <span class="time" id="currentTimeDisplay">00:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
                <input type="range" id="progressRange" min="0" max="100" value="0">
            </div>
            <span class="time" id="durationDisplay">00:00</span>
        </div>

        <div class="btn-group">
            <button id="prevSubBtn" title="Câu trước (↑)">⏮</button>
            <button id="jumpBackBtn" title="Tua lùi (←)">-<span id="jumpBackLabel">2</span>s</button>
            <button id="playBtn" class="play-btn" title="Phát / Tạm dừng (Space)">▶</button>
            <button id="jumpForwardBtn" title="Tua tiến (→)">+<span id="jumpForwardLabel">2</span>s</button>
            <button id="nextSubBtn" title="Câu sau (↓)">⏭</button>
            <button id="replaySubBtn" title="Phát lại câu (R)">🔁</button>

            <span class="sep"></span>

            <div class="jump-group">
                <button id="jumpDecBtn" title="Giảm 0.5s">−</button>
                <input type="number" id="jumpInput" min="0.1" step="0.5" value="2">
                <button id="jumpIncBtn" title="Tăng 0.5s">+</button>
                <label>s</label>
            </div>

            <span class="sep"></span>

            <button class="subtitle-ctrl-btn" id="subtitleFontDec" title="Giảm cỡ chữ">A−</button>
            <button class="subtitle-ctrl-btn" id="subtitleFontInc" title="Tăng cỡ chữ">A+</button>
            <button class="subtitle-ctrl-btn" id="subtitlePosUp" title="Di chuyển lên">↑</button>
            <button class="subtitle-ctrl-btn" id="subtitlePosDown" title="Di chuyển xuống">↓</button>
            <button class="subtitle-ctrl-btn" id="subtitleReset" title="Reset phụ đề">↺</button>

            <span class="sep"></span>

            <button class="subtitle-toggle-btn active" id="subtitleToggleBtn">CC</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  JAVASCRIPT
        // ================================================================

        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const video = document.getElementById('videoPlayer');
            const videoInput = document.getElementById('videoInput');
            const srtInput = document.getElementById('srtInput');
            const statusEl = document.getElementById('status');
            const transcriptList = document.getElementById('transcriptList');
            const progressFill = document.getElementById('progressFill');
            const progressRange = document.getElementById('progressRange');
            const progressBar = document.getElementById('progressBar');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const playBtn = document.getElementById('playBtn');
            const jumpBackBtn = document.getElementById('jumpBackBtn');
            const jumpForwardBtn = document.getElementById('jumpForwardBtn');
            const jumpBackLabel = document.getElementById('jumpBackLabel');
            const jumpForwardLabel = document.getElementById('jumpForwardLabel');
            const jumpInput = document.getElementById('jumpInput');
            const jumpDecBtn = document.getElementById('jumpDecBtn');
            const jumpIncBtn = document.getElementById('jumpIncBtn');
            const prevSubBtn = document.getElementById('prevSubBtn');
            const nextSubBtn = document.getElementById('nextSubBtn');
            const replaySubBtn = document.getElementById('replaySubBtn');
            const subtitleToggle = document.getElementById('subtitleToggle');
            const subtitleToggleBtn = document.getElementById('subtitleToggleBtn');
            const videoSubtitle = document.getElementById('videoSubtitle');
            const subtitleFontDec = document.getElementById('subtitleFontDec');
            const subtitleFontInc = document.getElementById('subtitleFontInc');
            const subtitlePosUp = document.getElementById('subtitlePosUp');
            const subtitlePosDown = document.getElementById('subtitlePosDown');
            const subtitleReset = document.getElementById('subtitleReset');

            // ---------- State ----------
            let subtitles = [];
            let currentSubIndex = -1;
            let jumpSeconds = 2;
            let isSubtitleVisible = true;
            let videoLoaded = false;
            let srtLoaded = false;
            let isDragging = false;
            let subtitleFontSize = 1.6;
            let subtitleBottom = 10;
            let isRestoring = false;
            let saveTimer = null;
            let videoBlob = null;       // Lưu blob để lưu vào IndexedDB
            let subtitleText = null;    // Lưu nội dung SRT gốc

            // ---------- IndexedDB helpers ----------
            const DB_NAME = 'LangPlayerDB';
            const STORE_NAME = 'state';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onupgradeneeded = function(e) {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME);
                        }
                    };
                    request.onsuccess = function(e) {
                        db = e.target.result;
                        resolve(db);
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            function saveData(key, value) {
                return new Promise((resolve, reject) => {
                    if (!db) return reject('DB not open');
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.put(value, key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            function getData(key) {
                return new Promise((resolve, reject) => {
                    if (!db) return reject('DB not open');
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            // ---------- Lưu trạng thái toàn bộ ----------
            async function saveFullState() {
                if (isRestoring) return;
                try {
                    const state = {
                        videoBlob: videoBlob,
                        subtitleText: subtitleText,
                        jumpSeconds: jumpSeconds,
                        subtitleFontSize: subtitleFontSize,
                        subtitleBottom: subtitleBottom,
                        subtitleVisible: isSubtitleVisible,
                        currentTime: video.currentTime || 0,
                        paused: video.paused !== undefined ? video.paused : true,
                        videoLoaded: videoLoaded,
                        srtLoaded: srtLoaded
                    };
                    await saveData('state', state);
                    // Cũng lưu các cài đặt riêng lẻ để tương thích
                    await saveData('jumpSeconds', jumpSeconds);
                    await saveData('subtitleFontSize', subtitleFontSize);
                    await saveData('subtitleBottom', subtitleBottom);
                    await saveData('subtitleVisible', isSubtitleVisible);
                } catch (e) {
                    console.warn('Lưu state lỗi:', e);
                }
            }

            // ---------- Khôi phục trạng thái ----------
            async function restoreState() {
                try {
                    isRestoring = true;
                    const state = await getData('state');
                    if (!state) {
                        isRestoring = false;
                        return;
                    }

                    // Khôi phục cài đặt
                    if (state.jumpSeconds !== undefined) {
                        jumpSeconds = state.jumpSeconds;
                        jumpInput.value = jumpSeconds;
                        jumpBackLabel.textContent = jumpSeconds;
                        jumpForwardLabel.textContent = jumpSeconds;
                    }
                    if (state.subtitleFontSize !== undefined) {
                        subtitleFontSize = state.subtitleFontSize;
                    }
                    if (state.subtitleBottom !== undefined) {
                        subtitleBottom = state.subtitleBottom;
                    }
                    if (state.subtitleVisible !== undefined) {
                        isSubtitleVisible = state.subtitleVisible;
                        subtitleToggle.checked = isSubtitleVisible;
                        subtitleToggleBtn.classList.toggle('active', isSubtitleVisible);
                    }
                    applySubtitleStyle();

                    // Khôi phục video
                    if (state.videoBlob) {
                        videoBlob = state.videoBlob;
                        const url = URL.createObjectURL(videoBlob);
                        video.src = url;
                        video.load();
                        videoLoaded = true;
                        setStatus('Đã khôi phục video', 'ok');

                        // Khi video loaded, set currentTime và paused
                        video.addEventListener('loadedmetadata', function onLoaded() {
                            video.removeEventListener('loadedmetadata', onLoaded);
                            if (state.currentTime !== undefined && state.currentTime < video.duration) {
                                video.currentTime = state.currentTime;
                            }
                            if (state.paused !== undefined) {
                                if (state.paused) {
                                    video.pause();
                                } else {
                                    video.play().catch(() => {});
                                }
                            }
                            updatePlayButton();
                            updateProgress();
                        });
                    }

                    // Khôi phục subtitle
                    if (state.subtitleText) {
                        subtitleText = state.subtitleText;
                        const parsed = parseSRT(subtitleText);
                        if (parsed.length) {
                            subtitles = parsed;
                            srtLoaded = true;
                            setStatus('Đã khôi phục ' + subtitles.length + ' subtitle', 'ok');
                        } else {
                            subtitles = [];
                        }
                        renderTranscript();
                        updateVideoSubtitle();
                        updateActiveSubtitle();
                    }

                    isRestoring = false;
                    // Lưu lại sau khi restore để đồng bộ
                    saveFullState();
                } catch (e) {
                    console.warn('Khôi phục state lỗi:', e);
                    isRestoring = false;
                }
            }

            // ---------- Hàm tiện ích ----------
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || seconds < 0) seconds = 0;
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) {
                    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                }
                return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
            }

            function setStatus(msg, type) {
                statusEl.textContent = msg;
                statusEl.className = 'status';
                if (type) statusEl.classList.add(type);
            }

            // ---------- Parse SRT ----------
            function parseSRT(text) {
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const lines = text.split(/\r?\n/);
                const subs = [];
                let i = 0;
                while (i < lines.length) {
                    while (i < lines.length && lines[i].trim() === '') i++;
                    if (i >= lines.length) break;
                    i++;
                    if (i >= lines.length) break;
                    const tsLine = lines[i].trim();
                    const tsMatch = tsLine.match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/);
                    i++;
                    if (!tsMatch) {
                        const simpleMatch = tsLine.match(/(\d{2}):(\d{2}):(\d{2})\s*-->\s*(\d{2}):(\d{2}):(\d{2})/);
                        if (simpleMatch) {
                            const start = parseInt(simpleMatch[1])*3600 + parseInt(simpleMatch[2])*60 + parseInt(simpleMatch[3]);
                            const end = parseInt(simpleMatch[4])*3600 + parseInt(simpleMatch[5])*60 + parseInt(simpleMatch[6]);
                            let textLines = [];
                            while (i < lines.length && lines[i].trim() !== '') {
                                textLines.push(lines[i].trim());
                                i++;
                            }
                            if (textLines.length) {
                                subs.push({ start, end, text: textLines.join('\n') });
                            }
                            continue;
                        }
                        while (i < lines.length && lines[i].trim() !== '') i++;
                        continue;
                    }
                    const start = parseInt(tsMatch[1])*3600 + parseInt(tsMatch[2])*60 + parseInt(tsMatch[3]) + parseInt(tsMatch[4])/1000;
                    const end = parseInt(tsMatch[5])*3600 + parseInt(tsMatch[6])*60 + parseInt(tsMatch[7]) + parseInt(tsMatch[8])/1000;
                    let textLines = [];
                    while (i < lines.length && lines[i].trim() !== '') {
                        textLines.push(lines[i].trim());
                        i++;
                    }
                    if (textLines.length) {
                        subs.push({ start, end, text: textLines.join('\n') });
                    }
                }
                return subs;
            }

            // ---------- Binary search subtitle ----------
            function findSubtitleIndex(time) {
                if (!subtitles.length) return -1;
                let lo = 0, hi = subtitles.length - 1, ans = -1;
                while (lo <= hi) {
                    const mid = (lo + hi) >> 1;
                    if (subtitles[mid].start <= time) {
                        ans = mid;
                        lo = mid + 1;
                    } else {
                        hi = mid - 1;
                    }
                }
                if (ans === -1) return -1;
                if (time < subtitles[ans].end) return ans;
                if (ans + 1 < subtitles.length && subtitles[ans + 1].start <= time && time < subtitles[ans + 1].end) {
                    return ans + 1;
                }
                return -1;
            }

            // ---------- Cập nhật transcript ----------
            function renderTranscript() {
                transcriptList.innerHTML = '';
                if (!subtitles.length) {
                    transcriptList.innerHTML = '<div class="transcript-empty">Chưa có phụ đề</div>';
                    return;
                }
                const fragment = document.createDocumentFragment();
                subtitles.forEach((sub, idx) => {
                    const div = document.createElement('div');
                    div.className = 'transcript-item';
                    if (idx === currentSubIndex) div.classList.add('active');
                    div.dataset.index = idx;

                    const tsSpan = document.createElement('span');
                    tsSpan.className = 'ts';
                    tsSpan.textContent = formatTime(sub.start);
                    div.appendChild(tsSpan);

                    const textSpan = document.createElement('span');
                    textSpan.className = 'text';
                    textSpan.textContent = sub.text;
                    div.appendChild(textSpan);

                    div.addEventListener('click', function(e) {
                        const index = parseInt(this.dataset.index);
                        if (!isNaN(index) && index >= 0 && index < subtitles.length) {
                            video.currentTime = subtitles[index].start;
                            updateActiveSubtitle();
                            saveFullState();
                        }
                    });
                    fragment.appendChild(div);
                });
                transcriptList.appendChild(fragment);
            }

            // ---------- Cập nhật active subtitle và scroll ----------
            function updateActiveSubtitle() {
                const time = video.currentTime;
                const newIdx = findSubtitleIndex(time);
                if (newIdx !== currentSubIndex) {
                    currentSubIndex = newIdx;
                    const items = transcriptList.querySelectorAll('.transcript-item');
                    items.forEach((el, idx) => {
                        el.classList.toggle('active', idx === currentSubIndex);
                    });
                    updateVideoSubtitle();
                }
                if (currentSubIndex >= 0) {
                    const activeItem = transcriptList.querySelector('.transcript-item.active');
                    if (activeItem) {
                        activeItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                }
            }

            // ---------- Cập nhật subtitle trên video ----------
            function updateVideoSubtitle() {
                if (!isSubtitleVisible) {
                    videoSubtitle.classList.add('hidden');
                    videoSubtitle.textContent = '';
                    return;
                }
                if (currentSubIndex >= 0 && currentSubIndex < subtitles.length) {
                    const sub = subtitles[currentSubIndex];
                    videoSubtitle.textContent = sub.text;
                    videoSubtitle.classList.remove('hidden');
                } else {
                    videoSubtitle.textContent = '';
                    videoSubtitle.classList.add('hidden');
                }
            }

            // ---------- Cập nhật progress & time ----------
            function updateProgress() {
                if (!video.duration || isNaN(video.duration)) return;
                const pct = (video.currentTime / video.duration) * 100;
                progressFill.style.width = pct + '%';
                progressRange.value = pct;
                currentTimeDisplay.textContent = formatTime(video.currentTime);
                durationDisplay.textContent = formatTime(video.duration);
            }

            // ---------- Cập nhật nút play ----------
            function updatePlayButton() {
                playBtn.textContent = video.paused ? '▶' : '⏸';
            }

            // ---------- Tải video ----------
            function loadVideo(file) {
                if (!file) return;
                const url = URL.createObjectURL(file);
                video.src = url;
                video.load();
                videoLoaded = true;
                videoBlob = file;
                setStatus('Đã tải video: ' + file.name, 'ok');
                if (!srtLoaded) {
                    subtitles = [];
                    currentSubIndex = -1;
                    renderTranscript();
                    updateVideoSubtitle();
                }
                saveFullState();
            }

            // ---------- Tải SRT ----------
            function loadSRT(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const text = e.target.result;
                        subtitleText = text;
                        const parsed = parseSRT(text);
                        if (parsed.length === 0) {
                            setStatus('Không tìm thấy subtitle hợp lệ', 'warn');
                            subtitles = [];
                        } else {
                            subtitles = parsed;
                            srtLoaded = true;
                            setStatus('Đã tải ' + subtitles.length + ' subtitle', 'ok');
                        }
                        currentSubIndex = -1;
                        renderTranscript();
                        updateVideoSubtitle();
                        updateActiveSubtitle();
                        saveFullState();
                    } catch (err) {
                        setStatus('Lỗi đọc SRT: ' + err.message, 'err');
                        subtitles = [];
                        renderTranscript();
                    }
                };
                reader.onerror = function() {
                    setStatus('Lỗi đọc file SRT', 'err');
                };
                reader.readAsText(file, 'UTF-8');
            }

            // ---------- Điều khiển ----------
            function togglePlay() {
                if (!videoLoaded) return;
                if (video.paused) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
                saveFullState();
            }

            function jump(seconds) {
                if (!videoLoaded) return;
                let newTime = video.currentTime + seconds;
                if (newTime < 0) newTime = 0;
                if (newTime > video.duration) newTime = video.duration;
                video.currentTime = newTime;
                saveFullState();
            }

            function previousSubtitle() {
                if (!subtitles.length || !videoLoaded) return;
                let idx = currentSubIndex;
                if (idx < 0) {
                    const t = video.currentTime;
                    let found = -1;
                    for (let i = subtitles.length - 1; i >= 0; i--) {
                        if (subtitles[i].start < t) { found = i; break; }
                    }
                    if (found < 0) found = 0;
                    else found = Math.max(0, found - 1);
                    idx = found;
                } else {
                    idx = Math.max(0, idx - 1);
                }
                video.currentTime = subtitles[idx].start;
                updateActiveSubtitle();
                saveFullState();
            }

            function nextSubtitle() {
                if (!subtitles.length || !videoLoaded) return;
                let idx = currentSubIndex;
                if (idx < 0) {
                    const t = video.currentTime;
                    let found = -1;
                    for (let i = 0; i < subtitles.length; i++) {
                        if (subtitles[i].start > t) { found = i; break; }
                    }
                    if (found < 0) found = subtitles.length - 1;
                    idx = found;
                } else {
                    idx = Math.min(subtitles.length - 1, idx + 1);
                }
                video.currentTime = subtitles[idx].start;
                updateActiveSubtitle();
                saveFullState();
            }

            function replaySubtitle() {
                if (!subtitles.length || !videoLoaded) return;
                const idx = currentSubIndex;
                if (idx < 0) return;
                video.currentTime = subtitles[idx].start;
                video.play().catch(() => {});
                saveFullState();
            }

            // ---------- Cập nhật jump label ----------
            function updateJumpLabels() {
                const val = parseFloat(jumpInput.value);
                if (!isNaN(val) && val > 0) {
                    jumpSeconds = val;
                    jumpBackLabel.textContent = val;
                    jumpForwardLabel.textContent = val;
                    localStorage.setItem('langplayer_jump', val);
                    saveFullState();
                }
            }

            // ---------- Toggle subtitle ----------
            function toggleSubtitle(show) {
                isSubtitleVisible = (show !== undefined) ? show : !isSubtitleVisible;
                subtitleToggle.checked = isSubtitleVisible;
                subtitleToggleBtn.classList.toggle('active', isSubtitleVisible);
                updateVideoSubtitle();
                localStorage.setItem('langplayer_subtitle', isSubtitleVisible ? '1' : '0');
                saveFullState();
            }

            // ---------- Điều chỉnh phụ đề ----------
            function applySubtitleStyle() {
                videoSubtitle.style.fontSize = subtitleFontSize + 'rem';
                videoSubtitle.style.bottom = subtitleBottom + '%';
                localStorage.setItem('langplayer_sub_font', subtitleFontSize);
                localStorage.setItem('langplayer_sub_bottom', subtitleBottom);
                saveFullState();
            }

            // ---------- Sự kiện ----------
            video.addEventListener('loadedmetadata', function() {
                durationDisplay.textContent = formatTime(video.duration);
                updateProgress();
                // Nếu đang restore, có thể đã set currentTime trong sự kiện khác
            });

            video.addEventListener('timeupdate', function() {
                updateProgress();
                updateActiveSubtitle();
                // Lưu state mỗi 3 giây
                if (!saveTimer) {
                    saveTimer = setTimeout(() => {
                        saveFullState();
                        saveTimer = null;
                    }, 3000);
                }
            });

            video.addEventListener('play', function() {
                updatePlayButton();
                saveFullState();
            });
            video.addEventListener('pause', function() {
                updatePlayButton();
                saveFullState();
            });
            video.addEventListener('ended', function() {
                updatePlayButton();
                saveFullState();
            });

            video.addEventListener('click', togglePlay);

            // Progress bar
            progressRange.addEventListener('input', function(e) {
                if (!video.duration || isNaN(video.duration)) return;
                const pct = parseFloat(this.value);
                progressFill.style.width = pct + '%';
                video.currentTime = (pct / 100) * video.duration;
                saveFullState();
            });

            progressBar.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                if (x >= 0 && x <= 1) {
                    progressRange.value = x * 100;
                    progressFill.style.width = (x * 100) + '%';
                    if (video.duration) {
                        video.currentTime = x * video.duration;
                        saveFullState();
                    }
                }
            });

            // Controls
            playBtn.addEventListener('click', togglePlay);

            jumpBackBtn.addEventListener('click', function() {
                jump(-jumpSeconds);
            });
            jumpForwardBtn.addEventListener('click', function() {
                jump(jumpSeconds);
            });

            prevSubBtn.addEventListener('click', previousSubtitle);
            nextSubBtn.addEventListener('click', nextSubtitle);
            replaySubBtn.addEventListener('click', replaySubtitle);

            // Jump input
            jumpInput.addEventListener('change', function() {
                let val = parseFloat(this.value);
                if (isNaN(val) || val <= 0) {
                    val = 2;
                    this.value = 2;
                }
                updateJumpLabels();
            });
            jumpInput.addEventListener('input', function() {
                let val = parseFloat(this.value);
                if (!isNaN(val) && val > 0) {
                    jumpSeconds = val;
                    jumpBackLabel.textContent = val;
                    jumpForwardLabel.textContent = val;
                }
            });

            jumpDecBtn.addEventListener('click', function() {
                let val = parseFloat(jumpInput.value);
                if (isNaN(val) || val <= 0) val = 2;
                val = Math.max(0.1, val - 0.5);
                jumpInput.value = val;
                jumpSeconds = val;
                jumpBackLabel.textContent = val;
                jumpForwardLabel.textContent = val;
                localStorage.setItem('langplayer_jump', val);
                saveFullState();
            });

            jumpIncBtn.addEventListener('click', function() {
                let val = parseFloat(jumpInput.value);
                if (isNaN(val) || val <= 0) val = 2;
                val = Math.min(60, val + 0.5);
                jumpInput.value = val;
                jumpSeconds = val;
                jumpBackLabel.textContent = val;
                jumpForwardLabel.textContent = val;
                localStorage.setItem('langplayer_jump', val);
                saveFullState();
            });

            // Subtitle toggle
            subtitleToggle.addEventListener('change', function() {
                toggleSubtitle(this.checked);
            });
            subtitleToggleBtn.addEventListener('click', function() {
                toggleSubtitle();
            });

            // Điều chỉnh phụ đề
            subtitleFontDec.addEventListener('click', function() {
                subtitleFontSize = Math.max(0.5, subtitleFontSize - 0.1);
                applySubtitleStyle();
            });
            subtitleFontInc.addEventListener('click', function() {
                subtitleFontSize = Math.min(4, subtitleFontSize + 0.1);
                applySubtitleStyle();
            });
            subtitlePosUp.addEventListener('click', function() {
                subtitleBottom = Math.min(50, subtitleBottom + 1);
                applySubtitleStyle();
            });
            subtitlePosDown.addEventListener('click', function() {
                subtitleBottom = Math.max(0, subtitleBottom - 1);
                applySubtitleStyle();
            });
            subtitleReset.addEventListener('click', function() {
                subtitleFontSize = 1.6;
                subtitleBottom = 10;
                applySubtitleStyle();
            });

            // File inputs
            videoInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    loadVideo(this.files[0]);
                }
                this.value = '';
            });

            srtInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    loadSRT(this.files[0]);
                }
                this.value = '';
            });

            // ---------- Phím tắt ----------
            document.addEventListener('keydown', function(e) {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                const key = e.key;
                let handled = true;

                switch (key) {
                    case ' ':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        jump(-jumpSeconds);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        jump(jumpSeconds);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        previousSubtitle();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        nextSubtitle();
                        break;
                    case 'r':
                    case 'R':
                        e.preventDefault();
                        replaySubtitle();
                        break;
                    case 'Home':
                        e.preventDefault();
                        if (videoLoaded) video.currentTime = 0;
                        saveFullState();
                        break;
                    case 'End':
                        e.preventDefault();
                        if (videoLoaded && video.duration) video.currentTime = video.duration;
                        saveFullState();
                        break;
                    default:
                        handled = false;
                }
                if (handled) e.stopPropagation();
            });

            // ---------- Khởi tạo ----------
            function loadSettings() {
                const savedJump = localStorage.getItem('langplayer_jump');
                if (savedJump) {
                    const val = parseFloat(savedJump);
                    if (!isNaN(val) && val > 0) {
                        jumpInput.value = val;
                        jumpSeconds = val;
                        jumpBackLabel.textContent = val;
                        jumpForwardLabel.textContent = val;
                    }
                }
                const savedSub = localStorage.getItem('langplayer_subtitle');
                if (savedSub === '0') {
                    toggleSubtitle(false);
                } else {
                    toggleSubtitle(true);
                }
                // Font & position
                const savedFont = parseFloat(localStorage.getItem('langplayer_sub_font'));
                if (!isNaN(savedFont) && savedFont >= 0.5 && savedFont <= 4) {
                    subtitleFontSize = savedFont;
                }
                const savedBottom = parseFloat(localStorage.getItem('langplayer_sub_bottom'));
                if (!isNaN(savedBottom) && savedBottom >= 0 && savedBottom <= 50) {
                    subtitleBottom = savedBottom;
                }
                applySubtitleStyle();
            }

            // Khởi tạo: mở DB, load settings, restore state
            async function init() {
                try {
                    await openDB();
                    loadSettings();
                    await restoreState();
                } catch (e) {
                    console.warn('Init error:', e);
                }
                // Cập nhật UI
                setStatus('Sẵn sàng', 'warn');
                renderTranscript();
                updateVideoSubtitle();
                updatePlayButton();
                // Nếu không có video, hiển thị hướng dẫn
                if (!videoLoaded) {
                    setStatus('Chọn video để bắt đầu', 'warn');
                }
            }

            // Các sự kiện phụ
            progressRange.addEventListener('mousedown', function(e) {
                isDragging = true;
            });
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });
            progressRange.addEventListener('wheel', function(e) {
                e.stopPropagation();
            });
            progressRange.addEventListener('touchstart', function(e) {});

            window.addEventListener('beforeunload', function() {
                saveFullState();
            });

            // Bắt đầu
            init();

            console.log('LangPlayer đã sẵn sàng.');
        })();
    </script>
</body>
</html>
