<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1016">
<title>Flashcards</title>
<style>
:root{
  --bg:#0e1016; --surface:#181b24; --surface-2:#21252f; --border:#2b303d;
  --text:#eef1f7; --muted:#8b93a7; --accent:#6c8cff; --accent-2:#8b5cf6;
  --green:#34d399; --red:#f87171; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--text); overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
input,textarea,select{outline:none;}

/* ---------- Layout ---------- */
.view{display:none;flex-direction:column;height:100vh;height:100dvh;}
.view.active{display:flex;}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
  flex-shrink:0;
}
.topbar h1{font-size:22px;font-weight:700;margin:0;flex:1;letter-spacing:-.3px;}
.scroll{flex:1;overflow-y:auto;padding:0 16px calc(32px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}

/* ---------- Buttons ---------- */
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);font-size:18px;color:var(--text);
  flex-shrink:0;transition:.15s;
}
.icon-btn:active{transform:scale(.93);}
.icon-btn:disabled{opacity:.35;}
.icon-btn.round{border-radius:50%;width:50px;height:50px;font-size:20px;}
.btn{
  padding:14px 20px;border-radius:14px;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 24px -10px var(--accent);}
.btn.primary:disabled{opacity:.4;box-shadow:none;}
.btn.ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);}
.btn.danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25);}
.btn.success{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.25);}
.btn.big{width:100%;padding:16px;font-size:17px;margin-top:8px;}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px;}
.flex1{flex:1;}

/* ---------- Set list ---------- */
.set-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 14px 14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;
  transition:.15s;
}
.set-card:active{background:var(--surface-2);}
.set-info{flex:1;min-width:0;}
.set-name{font-size:16px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-meta{font-size:13px;color:var(--muted);}
.set-ctrl{display:flex;flex-direction:column;gap:4px;}
.set-ctrl button{
  width:32px;height:26px;border-radius:8px;background:var(--surface-2);
  color:var(--muted);font-size:11px;border:1px solid var(--border);
}
.set-ctrl button:disabled{opacity:.25;}
.set-ctrl button:active{background:var(--border);}

.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty-emoji{font-size:56px;margin-bottom:14px;}
.empty p{margin:0 0 22px;font-size:15px;}
.empty .btn{display:inline-flex;margin:0 auto;}

/* ---------- Set detail ---------- */
.name-input{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:10px 14px;font-size:16px;font-weight:600;
}
.lang-row{display:flex;align-items:center;gap:8px;padding:0 16px 12px;}
.lang-row select{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 10px;font-size:14px;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b93a7'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:18px;
  padding-right:28px;
}
.lang-arrow{color:var(--muted);font-size:16px;flex-shrink:0;}
.pad{padding:0 16px;}

.tabs{display:flex;gap:6px;padding:18px 16px 10px;}
.tabs button{
  flex:1;padding:10px;border-radius:12px;font-size:14px;font-weight:600;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
}
.tabs button.active{background:var(--surface-2);color:var(--text);border-color:var(--accent);}

.word-item{
  display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;margin-bottom:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
}
.wi-main{flex:1;min-width:0;cursor:pointer;}
.wi-term{font-size:15px;font-weight:600;margin-bottom:2px;}
.wi-mean{font-size:14px;color:var(--muted);}
.wi-ex{font-size:12.5px;color:#5f6678;margin-top:4px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wi-speak{width:36px;height:36px;border-radius:10px;background:rgba(108,140,255,.12);color:var(--accent);font-size:16px;flex-shrink:0;}
.wi-del{width:32px;height:32px;border-radius:10px;background:rgba(248,113,113,.1);color:var(--red);font-size:15px;flex-shrink:0;}

textarea.csv{
  width:100%;min-height:150px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:14px;font-size:14px;resize:vertical;line-height:1.5;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.hintbox{font-size:12.5px;color:var(--muted);line-height:1.7;margin:10px 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.hintbox code{background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--accent);font-size:12px;}
.section-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none;}
.sheet.open{display:block;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);animation:fade .2s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 16px;}
.sheet-panel h3{margin:0 0 20px;font-size:19px;font-weight:700;}

.field{margin-bottom:22px;}
.field > label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips button{
  padding:10px 15px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:500;transition:.15s;
}
.chips button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.switch-row span{font-size:14.5px;}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);position:relative;transition:.2s;flex-shrink:0;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#5b6274;transition:.2s;}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}
.switch.on::after{left:23px;background:#fff;}

.form-input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;
  padding:14px;font-size:15.5px;margin-bottom:10px;
}
textarea.form-input{min-height:74px;resize:vertical;line-height:1.5;}

/* ---------- Study ---------- */
.study-top{padding-bottom:6px;}
.study-info{flex:1;min-width:0;text-align:center;}
.study-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.study-progress{font-size:12.5px;color:var(--muted);margin-top:2px;}
.progress-line{height:3px;background:var(--surface-2);margin:0 16px;border-radius:99px;overflow:hidden;flex-shrink:0;}
#studyBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s ease;}
.study-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.study-actions{
  display:flex;flex-direction:column;gap:10px;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));flex-shrink:0;
}
.act-row{display:flex;gap:10px;align-items:center;}
.act-row .btn{white-space:nowrap;}

.flashcard{
  width:100%;min-height:52vh;background:linear-gradient(160deg,#1e2230,#161923);
  border:1px solid var(--border);border-radius:26px;
  padding:30px 22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:10px;
  animation:pop .22s ease;box-shadow:0 24px 60px -30px #000;
  cursor:pointer;
}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.card-lang{font-size:11.5px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.card-main{font-size:34px;font-weight:700;line-height:1.25;word-break:break-word;}
.card-main.small{font-size:19px;font-weight:600;color:#c2c8d8;}
.card-divider{width:52px;height:2px;background:var(--border);border-radius:99px;margin:6px 0;}
.flashcard .hint{font-size:12.5px;color:var(--muted);margin-top:14px;opacity:.75;}

.example{
  margin-top:14px;padding-top:16px;border-top:1px dashed var(--border);width:100%;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.ex-src{font-size:15px;color:#b9c0d2;line-height:1.5;}
.ex-tgt{font-size:14px;color:var(--muted);line-height:1.5;font-style:italic;}
.show-ex-btn{
  font-size:13px;padding:8px 16px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
}

.flashcard.audio-hidden{justify-content:center;gap:18px;cursor:pointer;}
.audio-icon{font-size:60px;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}

/* ---------- Done / Summary ---------- */
.done-screen{text-align:left;padding:8px 0 0;width:100%;}
.done-top{text-align:center;}
.done-emoji{font-size:56px;margin-bottom:12px;line-height:1;}
.done-top h2{margin:0 0 6px;font-size:22px;font-weight:700;}
.done-top p{margin:0;color:var(--muted);font-size:14.5px;}

.summary-wrap{
  margin-top:20px;display:flex;flex-direction:column;gap:14px;
}
.summary-section{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;
}
.summary-head{
  padding:11px 14px;font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.summary-head.green{color:var(--green);background:rgba(52,211,153,.09);}
.summary-head.red{color:var(--red);background:rgba(248,113,113,.09);}
.summary-head .count{
  font-size:12px;padding:2px 10px;border-radius:999px;
  background:rgba(255,255,255,.07);color:inherit;letter-spacing:0;
}
.summary-item{
  padding:10px 14px;border-top:1px solid var(--border);font-size:14px;line-height:1.4;
}
.summary-item .st{font-weight:600;color:var(--text);}
.summary-item .sm{font-size:13px;color:var(--muted);margin-top:3px;}
.summary-empty{padding:12px 14px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--border);}
</style>
</head>
<body>

<!-- ============ SET LIST ============ -->
<section id="view-sets" class="view active">
  <header class="topbar">
    <h1>Flashcard Sets</h1>
    <button class="icon-btn" id="btnNewSet">+</button>
  </header>
  <div class="scroll" id="setsList"></div>
</section>

<!-- ============ SET DETAIL ============ -->
<section id="view-set" class="view">
  <header class="topbar">
    <button class="icon-btn" id="btnBackSets">←</button>
    <input class="name-input" id="setNameInput" placeholder="Set name">
    <button class="icon-btn" id="btnDeleteSet">🗑</button>
  </header>

  <div class="lang-row">
    <select id="srcLang"></select>
    <span class="lang-arrow">→</span>
    <select id="tgtLang"></select>
  </div>

  <div class="pad">
    <button class="btn primary big" id="btnStart">▶ Study</button>
  </div>

  <div class="tabs">
    <button data-tab="cards" class="active">Cards</button>
    <button data-tab="add">Add words</button>
  </div>

  <div class="scroll">
    <div id="tab-cards"></div>
    <div id="tab-add" style="display:none">
      <div class="hintbox">
        Paste CSV data, one card per line:<br>
        <code>term, meaning, example, example translation</code><br>
        Columns 3 and 4 are optional. Supports comma, tab, or semicolon.
      </div>
      <textarea class="csv" id="csvInput" placeholder='hello,xin chào,Hello there!,Chào bạn!
book,quyển sách,This is my book,Đây là sách của tôi'></textarea>
      <label class="switch-row" style="margin-top:6px">
        <span style="color:var(--muted);font-size:13.5px">First row is header</span>
        <button class="switch" id="optHeader"></button>
      </label>
      <button class="btn primary big" id="btnImportCsv">Import from CSV</button>

      <div class="section-label">Manual add</div>
      <button class="btn ghost big" id="btnAddManual" style="margin:0">+ Add a card</button>
    </div>
  </div>
</section>

<!-- ============ STUDY ============ -->
<section id="view-study" class="view">
  <header class="topbar study-top">
    <button class="icon-btn" id="btnExitStudy">✕</button>
    <div class="study-info">
      <div class="study-title" id="studyTitle"></div>
      <div class="study-progress" id="studyProgress"></div>
    </div>
    <button class="icon-btn" id="btnStudyOpts">⚙</button>
  </header>
  <div class="progress-line"><div id="studyBar"></div></div>
  <div class="study-body" id="studyBody"></div>
  <div class="study-actions" id="studyActions"></div>
</section>

<!-- ============ SHEET: STUDY OPTIONS ============ -->
<div class="sheet" id="sheetOptions">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3 id="optionsTitle">Study options</h3>

    <div class="field">
      <label>Front side</label>
      <div class="chips" id="optDirection">
        <button data-v="source">Source first</button>
        <button data-v="target">Meaning first</button>
      </div>
    </div>

    <div class="field">
      <label>Card order</label>
      <div class="chips" id="optOrder">
        <button data-v="down">Top → bottom</button>
        <button data-v="up">Bottom → top</button>
        <button data-v="random">Random</button>
      </div>
    </div>

    <div class="field">
      <label>Cards per batch</label>
      <div class="chips" id="optBatch">
        <button data-v="5">5</button>
        <button data-v="6">6</button>
        <button data-v="7">7</button>
        <button data-v="8">8</button>
        <button data-v="9">9</button>
        <button data-v="10">10</button>
      </div>
    </div>

    <div class="field">
      <label>Audio mode</label>
      <div class="switch-row">
        <span>Hide content, listen only</span>
        <button class="switch" id="optAudio"></button>
      </div>
    </div>

    <div class="field">
      <label>Audio options</label>
      <div class="switch-row">
        <span>Auto-read when card appears</span>
        <button class="switch" id="optAutoRead"></button>
      </div>
      <div class="chips" id="optReadWhat" style="margin-top:8px">
        <button data-v="term">Term</button>
        <button data-v="meaning">Meaning</button>
        <button data-v="example">Example</button>
        <button data-v="exampleTrans">Ex. translation</button>
      </div>
    </div>

    <button class="btn primary big" id="btnBegin">Start</button>
  </div>
</div>

<!-- ============ SHEET: CARD EDIT ============ -->
<div class="sheet" id="sheetCard">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3 id="cardModalTitle">Add card</h3>
    <input class="form-input" id="fTerm" placeholder="Term / phrase (source language)">
    <input class="form-input" id="fMeaning" placeholder="Meaning (target language)">
    <textarea class="form-input" id="fExample" placeholder="Example (optional)"></textarea>
    <textarea class="form-input" id="fExTrans" placeholder="Example translation (optional)"></textarea>
    <button class="btn primary big" id="btnSaveCard">Save</button>
  </div>
</div>

<!-- ============ SHEET: SPEAK MENU ============ -->
<div class="sheet" id="sheetSpeak">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3>Listen</h3>
    <div id="speakBody"></div>
  </div>
</div>

<script>
/* ================= LANGUAGES ================= */
const LANGUAGES = [
  {code:'en-US',name:'English (US)'},{code:'en-GB',name:'English (UK)'},
  {code:'vi-VN',name:'Tiếng Việt'},{code:'ja-JP',name:'日本語'},
  {code:'zh-CN',name:'中文 (简体)'},{code:'zh-TW',name:'中文 (繁體)'},
  {code:'ko-KR',name:'한국어'},{code:'fr-FR',name:'Français'},
  {code:'de-DE',name:'Deutsch'},{code:'es-ES',name:'Español'},
  {code:'it-IT',name:'Italiano'},{code:'pt-BR',name:'Português (BR)'},
  {code:'ru-RU',name:'Русский'},{code:'th-TH',name:'ไทย'},
  {code:'id-ID',name:'Bahasa Indonesia'},{code:'ms-MY',name:'Bahasa Melayu'},
  {code:'hi-IN',name:'हिन्दी'},{code:'ar-SA',name:'العربية'},
  {code:'nl-NL',name:'Nederlands'},{code:'pl-PL',name:'Polski'},
  {code:'tr-TR',name:'Türkçe'},{code:'sv-SE',name:'Svenska'},
  {code:'da-DK',name:'Dansk'},{code:'nb-NO',name:'Norsk'},
  {code:'fi-FI',name:'Suomi'},{code:'cs-CZ',name:'Čeština'},
  {code:'el-GR',name:'Ελληνικά'},{code:'he-IL',name:'עברית'},
  {code:'uk-UA',name:'Українська'},{code:'tl-PH',name:'Filipino'}
];

/* ================= STATE ================= */
const STORE_KEY = 'flashcards.v1';
const state = { sets: [], currentSetId: null, session: null };
let pendingOpts = null;
let editingCardId = null;
let csvHeaderSkip = false;
let speakCtx = null; // {card, set}

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const langShort = c => (c || '').split('-')[0].toUpperCase();
const getSet = id => state.sets.find(s => s.id === id);
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function defaultOptions(){
  return { direction:'source', order:'down', batch:5, audioMode:false, autoRead:true, readWhat:'term' };
}

/* ================= PERSISTENCE ================= */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.sets)){
        state.sets = d.sets.map(s => ({
          id: s.id || uid(),
          name: s.name || 'New set',
          sourceLang: s.sourceLang || 'en-US',
          targetLang: s.targetLang || 'vi-VN',
          cards: Array.isArray(s.cards) ? s.cards : [],
          options: Object.assign(defaultOptions(), s.options || {})
        }));
      }
    }
  }catch(e){ console.warn(e); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({ sets: state.sets })); }
  catch(e){ console.warn('save failed', e); }
}

/* ================= VIEWS ================= */
function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  if(name === 'sets') renderSets();
}

/* ================= SET LIST ================= */
function renderSets(){
  const list = $('setsList');
  if(!state.sets.length){
    list.innerHTML = `<div class="empty">
      <div class="empty-emoji">🗂️</div>
      <p>No flashcard sets yet</p>
      <button class="btn primary" id="btnEmptyNew">Create your first set</button>
    </div>`;
    $('btnEmptyNew').onclick = createSet;
    return;
  }
  list.innerHTML = state.sets.map((s,i) => `
    <div class="set-card" data-id="${s.id}">
      <div class="set-info" data-act="open">
        <div class="set-name">${esc(s.name)}</div>
        <div class="set-meta">${s.cards.length} cards · ${langShort(s.sourceLang)} → ${langShort(s.targetLang)}</div>
      </div>
      <div class="set-ctrl">
        <button data-act="up" ${i===0?'disabled':''}>▲</button>
        <button data-act="down" ${i===state.sets.length-1?'disabled':''}>▼</button>
      </div>
    </div>`).join('');

  list.querySelectorAll('.set-card').forEach(el => {
    el.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      const act = btn ? btn.dataset.act : 'open';
      const id = el.dataset.id;
      if(act === 'up') moveSet(id, -1);
      else if(act === 'down') moveSet(id, 1);
      else openSet(id);
    });
  });
}

function moveSet(id, dir){
  const i = state.sets.findIndex(s => s.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= state.sets.length) return;
  [state.sets[i], state.sets[j]] = [state.sets[j], state.sets[i]];
  save(); renderSets();
}

function createSet(){
  const s = {
    id: uid(), name: 'New set', sourceLang: 'en-US', targetLang: 'vi-VN',
    cards: [], options: defaultOptions()
  };
  state.sets.unshift(s);
  save();
  openSet(s.id);

/* ================= CSV ================= */
function detectDelimiter(text){
  const line = text.split(/\r?\n/)[0] || '';
  const counts = { ',': (line.match(/,/g)||[]).length, '\t': (line.match(/\t/g)||[]).length, ';': (line.match(/;/g)||[]).length };
  let best = ',', n = -1;
  for(const d in counts){ if(counts[d] > n){ n = counts[d]; best = d; } }
  return best;
}

function parseCSV(text, delim){
  const rows = [];
  let row = [], field = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === delim){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  row.push(field);
  rows.push(row);
  return rows.filter(r => r.some(cell => String(cell).trim() !== ''));
}

function importCSV(){
  const raw = $('csvInput').value;
  if(!raw.trim()) return;
  const delim = detectDelimiter(raw);
  let rows = parseCSV(raw, delim);

  if(csvHeaderSkip && rows.length) rows = rows.slice(1);
  else if(rows.length && /^(meaning|nghĩa|translation|dịch|definition)$/i.test(String(rows[0][1]||'').trim())){
    rows = rows.slice(1);
  }

  const set = getSet(state.currentSetId);
  let added = 0;
  rows.forEach(r => {
    const term = String(r[0] || '').trim();
    const meaning = String(r[1] || '').trim();
    if(!term && !meaning) return;
    set.cards.push({
      id: uid(),
      term: term || meaning,
      meaning: meaning || term,
      example: String(r[2] || '').trim(),
      exampleTrans: String(r[3] || '').trim()
    });
    added++;
  });

  save();
  $('csvInput').value = '';
  renderSetDetail();
  switchTab('cards');
  if(added) toast(`Added ${added} cards`);
}

function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b3040;color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s';
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; }, 1600);
  setTimeout(() => el.remove(), 2000);
}

/* ================= SPEECH ================= */
function initVoices(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => {};
}
function speak(text, lang){
  if(!text) return;
  if(!('speechSynthesis' in window)) { toast('Speech not supported'); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 0.95;
    const voices = speechSynthesis.getVoices();
    const short = (lang || '').slice(0,2).toLowerCase();
    const v = voices.find(x => x.lang.replace('_','-').toLowerCase() === (lang||'').toLowerCase())
           || voices.find(x => x.lang.toLowerCase().startsWith(short));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ console.warn(e); }
}

function speakField(field){
  const s = state.session;
  if(!s || s.done) return;
  const set = getSet(s.setId);
  const card = s.queue[s.pos];
  if(!card) return;
  const lang = (field === 'meaning' || field === 'exampleTrans') ? set.targetLang : set.sourceLang;
  speak(card[field], lang);
}

/* ================= SUMMARY BUILDER ================= */
function summaryHTML(rememberedCards, forgottenCards){
  const section = (title, cls, cards) => {
    if(!cards.length){
      return `<div class="summary-section">
        <div class="summary-head ${cls}">${title}<span class="count">0</span></div>
        <div class="summary-empty">No cards</div>
      </div>`;
    }
    return `<div class="summary-section">
      <div class="summary-head ${cls}">${title}<span class="count">${cards.length}</span></div>
      ${cards.map(c => `<div class="summary-item">
        <div class="st">${esc(c.term)}</div>
        <div class="sm">${esc(c.meaning)}</div>
      </div>`).join('')}
    </div>`;
  };
  return `<div class="summary-wrap">
    ${section('✓ Remembered', 'green', rememberedCards)}
    ${section('✗ Forgot', 'red', forgottenCards)}
  </div>`;
}

/* ================= STUDY SESSION ================= */
function beginStudy(){
  const set = getSet(state.currentSetId);
  if(!set || !set.cards.length) return;
  if(pendingOpts){ set.options = Object.assign({}, pendingOpts); save(); }

  const o = set.options;
  let queue = set.cards.slice();
  if(o.order === 'up') queue.reverse();
  else if(o.order === 'random') shuffle(queue);

  state.session = {
    setId: set.id,
    queue,
    pos: 0,
    stage: 'front',
    showExample: false,
    batch: Math.max(1, o.batch),
    batchStart: 0,
    done: null,
    remembered: new Set(),
    forgotten: new Set()
  };
  closeSheets();
  showView('study');
  renderStudy(true);
}

/* Apply new options to a live session */
function applyOptionsLive(){
  const s = state.session;
  if(!s) return;
  const set = getSet(s.setId);
  if(!set) return;

  const oldOpts = set.options;
  const newOpts = Object.assign({}, pendingOpts);

  const orderChanged  = oldOpts.order  !== newOpts.order;
  const directionChanged = oldOpts.direction !== newOpts.direction;

  set.options = newOpts;
  save();

  // Reorder remaining cards
  if(orderChanged){
    const head = s.queue.slice(0, s.pos + 1);
    let tail = s.queue.slice(s.pos + 1);
    if(newOpts.order === 'up') tail.reverse();
    else if(newOpts.order === 'random') shuffle(tail);
    s.queue = head.concat(tail);
  }

  // Update batch size
  s.batch = Math.max(1, newOpts.batch);

  // On direction change reset to front so the swap is visible
  if(directionChanged){
    s.stage = 'front';
    s.showExample = false;
  }

  closeSheets();
  renderStudy(true);
}

function renderStudy(autoSpeak){
  const s = state.session;
  if(!s) return;
  const set = getSet(s.setId);
  if(!set) return;
  const o = set.options;
  const body = $('studyBody');
  const actions = $('studyActions');

  $('studyTitle').textContent = set.name;

  /* ---------- ALL DONE ---------- */
  if(s.done === 'all'){
    const total = s.queue.length;
    $('studyProgress').textContent = `${total} / ${total}`;
    $('studyBar').style.width = '100%';
    body.onclick = null;

    const rememberedCards = s.queue.filter(c => s.remembered.has(c.id));
    const forgottenCards  = s.queue.filter(c => s.forgotten.has(c.id));

    body.innerHTML = `<div class="done-screen">
      <div class="done-top">
        <div class="done-emoji">🏆</div>
        <h2>Session complete!</h2>
        <p>Reviewed ${total} cards · Remembered ${rememberedCards.length} · Forgot ${forgottenCards.length}</p>
      </div>
      ${summaryHTML(rememberedCards, forgottenCards)}
    </div>`;
    actions.innerHTML = `
      <div class="act-row">
        <button class="btn ghost" id="btnBackSet" style="flex:1">Back to set</button>
        <button class="btn primary" id="btnRestart" style="flex:1">Study again</button>
      </div>`;
    $('btnBackSet').onclick = () => { state.session = null; openSet(set.id); };
    $('btnRestart').onclick = () => beginStudy();
    return;
  }

  /* ---------- BATCH DONE ---------- */
  if(s.done === 'batch'){
    const total = s.queue.length;
    $('studyProgress').textContent = `${s.pos} / ${total}`;
    $('studyBar').style.width = (s.pos / total * 100) + '%';
    body.onclick = null;

    const batchCards = s.queue.slice(s.batchStart, s.pos);
    const rememberedCards = batchCards.filter(c => s.remembered.has(c.id));
    const forgottenCards  = batchCards.filter(c => s.forgotten.has(c.id));

    body.innerHTML = `<div class="done-screen">
      <div class="done-top">
        <div class="done-emoji">🎉</div>
        <h2>Batch complete</h2>
        <p>${batchCards.length} cards · Remembered ${rememberedCards.length} · Forgot ${forgottenCards.length} · ${total - s.pos} left</p>
      </div>
      ${summaryHTML(rememberedCards, forgottenCards)}
    </div>`;
    actions.innerHTML = `
      <div class="act-row">
        <button class="btn ghost" id="btnRedoBatch" style="flex:1">↺ Redo batch</button>
        <button class="btn primary" id="btnNextBatch" style="flex:1">Next batch →</button>
      </div>`;
    $('btnRedoBatch').onclick = () => {
      batchCards.forEach(c => { s.remembered.delete(c.id); s.forgotten.delete(c.id); });
      s.pos = s.batchStart;
      s.stage = 'front';
      s.showExample = false;
      s.done = null;
      renderStudy(true);
    };
    $('btnNextBatch').onclick = () => {
      s.batchStart = s.pos;
      s.done = null;
      renderStudy(true);
    };
    return;
  }

  /* ---------- CARD ---------- */
  const card = s.queue[s.pos];
  if(!card){ s.done = 'all'; renderStudy(false); return; }

  const frontIsTerm = o.direction === 'source';
  const frontText = frontIsTerm ? card.term : card.meaning;
  const backText  = frontIsTerm ? card.meaning : card.term;
  const frontLang = frontIsTerm ? set.sourceLang : set.targetLang;
  const backLang  = frontIsTerm ? set.targetLang : set.sourceLang;

  $('studyProgress').textContent = `${s.pos + 1} / ${s.queue.length}`;
  $('studyBar').style.width = ((s.pos + 1) / s.queue.length * 100) + '%';

  /* --- FRONT STAGE --- */
  if(s.stage === 'front'){
    if(o.audioMode){
      body.innerHTML = `<div class="flashcard audio-hidden" data-action="flip">
        <div class="audio-icon">🔊</div>
        <div class="hint">${o.autoRead ? 'Playing… tap to reveal' : 'Tap to reveal'}</div>
      </div>`;
    } else {
      body.innerHTML = `<div class="flashcard" data-action="flip">
        <div class="card-lang">${langShort(frontLang)}</div>
        <div class="card-main">${esc(frontText)}</div>
        <div class="hint">Tap to flip</div>
      </div>`;
    }
  }
  /* --- BACK STAGE --- */
  else {
    body.innerHTML = `<div class="flashcard" data-action="flip">
      <div class="card-lang">${langShort(frontLang)}</div>
      <div class="card-main small">${esc(frontText)}</div>
      <div class="card-divider"></div>
      <div class="card-lang">${langShort(backLang)}</div>
      <div class="card-main">${esc(backText)}</div>
      ${card.example ? `<div class="example">
        ${s.showExample
          ? `<div class="ex-src">${esc(card.example)}</div>
             ${card.exampleTrans ? `<div class="ex-tgt">${esc(card.exampleTrans)}</div>` : ''}`
          : `<button class="show-ex-btn" data-action="showExample">👁 Show example</button>`}
      </div>` : ''}
      <div class="hint">Tap to flip back</div>
    </div>`;
  }

  body.onclick = e => {
    const btn = e.target.closest('[data-action]');
    const action = btn ? btn.dataset.action : null;
    if(action === 'showExample'){
      s.showExample = true;
      renderStudy(false);
      return;
    }
    flipCard();
  };

  /* --- ACTIONS --- */
  const listenRow = `
    <div class="act-row">
      <button class="btn ghost sm flex1" id="btnListen">🔊 Listen</button>
    </div>`;

  const navRow = `
    <div class="act-row">
      <button class="icon-btn round" id="btnPrev" ${s.pos === 0 ? 'disabled' : ''}>←</button>
      <button class="btn danger flex1" id="btnForget">✗ Forgot</button>
      <button class="btn success flex1" id="btnRemember">✓ Got it</button>
      <button class="icon-btn round" id="btnNext">→</button>
    </div>`;

  actions.innerHTML = listenRow + navRow;

  $('btnListen').onclick = () => openSpeakSheet(card, set);
  $('btnPrev').onclick = prevCard;
  $('btnNext').onclick = () => { s.showExample = false; nextCard(); };
  $('btnForget').onclick = () => recordAnswer(false);
  $('btnRemember').onclick = () => recordAnswer(true);

  if(autoSpeak && o.audioMode && o.autoRead && s.stage === 'front'){
    const what = o.readWhat || 'term';
    setTimeout(() => speakField(what), 200);
  }
}

function flipCard(){
  const s = state.session;
  if(!s || s.done) return;
  s.stage = s.stage === 'front' ? 'back' : 'front';
  s.showExample = false;
  renderStudy(false);
}

function recordAnswer(remembered){
  const s = state.session;
  if(!s || s.done) return;
  const card = s.queue[s.pos];
  if(remembered){
    s.remembered.add(card.id);
    s.forgotten.delete(card.id);
  } else {
    s.forgotten.add(card.id);
    s.remembered.delete(card.id);
  }
  nextCard();
}

function nextCard(){
  const s = state.session;
  s.pos++;
  s.stage = 'front';
  s.showExample = false;
  if(s.pos >= s.queue.length){ s.done = 'all'; renderStudy(false); return; }
  if(s.pos - s.batchStart >= s.batch){ s.done = 'batch'; renderStudy(false); return; }
  renderStudy(true);
}

function prevCard(){
  const s = state.session;
  if(!s || s.done) return;
  if(s.pos > 0){
    s.pos--;
    s.stage = 'front';
    s.showExample = false;
    renderStudy(true);
  }
}

  bindChipGroup('optOrder', 'order', false);
  bindChipGroup('optBatch', 'batch', true);
  bindChipGroup('optReadWhat', 'readWhat', false);
  $('optAudio').onclick = e => {
    pendingOpts.audioMode = !pendingOpts.audioMode;
    e.currentTarget.classList.toggle('on', pendingOpts.audioMode);
  };
  $('optAutoRead').onclick = e => {
    pendingOpts.autoRead = !pendingOpts.autoRead;
    e.currentTarget.classList.toggle('on', pendingOpts.autoRead);
  };
  $('btnBegin').onclick = () => {
    const inStudy = $('btnBegin').dataset.inStudy === '1';
    if(inStudy){
      applyOptionsLive();
    } else {
      const set = getSet(state.currentSetId);
      if(!set) return;
      set.options = Object.assign({}, pendingOpts);
      save();
      beginStudy();
    }
  };

  /* card modal */
  $('btnSaveCard').onclick = saveCard;

  /* study */
  $('btnExitStudy').onclick = () => {
    const sid = state.session ? state.session.setId : state.currentSetId;
    state.session = null;
    if('speechSynthesis' in window) speechSynthesis.cancel();
    openSet(sid);
  };
  $('btnStudyOpts').onclick = () => openOptionsSheet(true);

  /* close sheets on backdrop */
  document.querySelectorAll('[data-close]').forEach(el => {
    el.onclick = () => closeSheets();
  });

  renderSets();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
