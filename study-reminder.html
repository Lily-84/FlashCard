<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Study Reminder - lập lịch và nhắc ôn tập" />
  
  <link rel="icon" href="icon.svg" />
  
  <title>Study Reminder</title>

<style>
:root{--bg:#0b0f14;--surface:#111827;--text:#f3f4f6;--muted:#98a2b3;--border:#273142;--primary:#0d2a67;--soft:#1f2937;--danger:#f97066;--success:#32d583;--shadow:0 8px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:76px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh}.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:10}.brand{font-weight:750;display:flex;gap:10px;align-items:center}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px}.main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:32px 0 48px}.view{display:none}.view.active{display:block}.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;color:var(--muted)}h1{font-size:32px;line-height:1.15;margin:0}h2,h3,p{margin-top:0}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.summary .number{font-size:28px;font-weight:800}.summary .label{font-size:13px;color:var(--muted);margin-top:3px}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.session-list,.plan-list{display:grid;gap:10px}.session{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px}.status-dot{width:9px;height:9px;border-radius:50%;background:#f79009;flex:0 0 auto}.status-dot.done{background:#12b76a}.status-dot.overdue{background:#f04438}.session-main{min-width:0;flex:1}.session-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{font-size:13px;color:var(--muted);margin-top:4px}.session-actions{display:flex;gap:7px}.btn{border:1px solid var(--border);border-radius:10px;padding:9px 13px;background:var(--surface);color:var(--text);font-weight:650;font-size:13px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.secondary{background:var(--soft);border-color:var(--soft)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger);background:#211416;border-color:#6b2b2b}.btn.full{width:100%}.button-row{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;background:var(--surface)}.calendar-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}.calendar-toolbar h2{margin:0;font-size:18px}.icon-btn{border:0;background:transparent;font-size:25px;width:38px;height:38px;border-radius:9px;color:var(--text)}.icon-btn:hover{background:var(--soft)}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px;text-align:center;border-bottom:1px solid var(--border)}.day{min-height:112px;padding:10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer}.day:nth-child(7n){border-right:0}.day.muted{color:#98a2b3;background:#0f141b}.day.today{background:#000000}.day-num{font-weight:700}.day-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}.day-badge{font-size:10px;border-radius:999px;background:var(--soft);padding:3px 6px;color:#344054}.day-badge.overdue{background:#2a1719;color:var(--danger)}.day-badge.done{background:#10251c;color:var(--success)}.selected-day{margin-top:18px}.plan{display:flex;justify-content:space-between;gap:20px;align-items:center}.plan-info{min-width:0}.plan-title{font-weight:750}.plan-description{color:var(--muted);font-size:13px;margin:5px 0 0}.plan-meta{font-size:12px;color:var(--muted);margin-top:8px}.plan-actions{display:flex;gap:7px;flex-wrap:wrap}.settings-stack{display:grid;gap:12px;max-width:760px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.setting-row p{margin:5px 0 0;color:var(--muted);font-size:13px}.select,input,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--surface);color:var(--text);outline:none}.select{width:auto;min-width:150px}.select:focus,input:focus,textarea:focus{border-color:#98a2b3;box-shadow:0 0 0 3px rgba(152,162,179,.15)}label{display:grid;gap:7px;font-size:13px;font-weight:650}.muted{color:var(--muted);font-size:13px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:rgba(17,24,39,.94);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:20}.nav-item{flex:1;max-width:170px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav-item span{font-size:20px;line-height:20px}.nav-item small{font-size:11px}.nav-item.active{color:var(--text);font-weight:750}.modal-card{width:min(560px,calc(100vw - 28px));padding:24px;border:0;border-radius:18px;background:var(--surface);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.2)}dialog{border:0;padding:0;background:transparent}dialog::backdrop{background:rgba(16,24,40,.5);backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.modal-head h2{margin:0}.modal-card>label{margin-bottom:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}.intervals{display:grid;gap:8px;margin-top:-4px}.interval-row{display:flex;gap:8px;align-items:center}.interval-row input{flex:1}.interval-row button{width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--danger)}.check-row{display:flex;align-items:center;grid-template-columns:auto 1fr;margin:15px 0}.check-row input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px;z-index:40;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}.file-btn{display:inline-flex;align-items:center}.overdue-heading{color:var(--danger)}
@media(min-width:800px){.bottom-nav{position:fixed;top:64px;bottom:0;right:auto;width:210px;height:auto;display:flex;flex-direction:column;justify-content:flex-start;padding:22px 12px;border-top:0;border-right:1px solid var(--border)}.nav-item{max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:10px}.nav-item span{font-size:18px}.main{margin-left:calc(210px + max(0px,(100vw - 1180px - 210px)/2));margin-right:max(16px,calc((100vw - 1180px - 210px)/2));width:min(970px,calc(100% - 242px))}body{padding-bottom:0}.topbar{padding-left:24px}.brand{margin-left:0}}
@media(max-width:650px){.main{width:calc(100% - 22px);padding-top:22px}.topbar{padding:0 12px}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{width:100%}h1{font-size:27px}.summary-grid{grid-template-columns:1fr 1fr}.summary:last-child{grid-column:1/-1}.session{align-items:flex-start}.session-actions{display:grid}.session-actions .btn{padding:8px}.calendar-card{overflow-x:auto}.calendar-grid{min-width:600px}.selected-day{margin-bottom:15px}.plan{align-items:flex-start;flex-direction:column}.plan-actions{width:100%}.plan-actions .btn{flex:1}.setting-row{align-items:flex-start;flex-direction:column}.select{width:100%}.modal-card{padding:19px}.form-grid{grid-template-columns:1fr}.modal-actions{position:sticky;bottom:-19px;background:var(--surface);padding-top:12px}.brand{font-size:14px}}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">SR</span><span>Study Reminder</span></div>
      <button id="installBtn" class="btn ghost hidden">Cài app</button>
    </header>

    <main class="main">
      <section id="view-today" class="view active">
        <div class="page-head">
          <div><p class="eyebrow" id="todayLabel"></p><h1>Hôm nay</h1></div>
          <button class="btn primary" data-action="new-plan">+ Tạo lịch ôn</button>
        </div>
        <div id="todaySummary" class="summary-grid"></div>
        <div id="todayContent"></div>
      </section>

      <section id="view-calendar" class="view">
        <div class="page-head"><div><p class="eyebrow">Lịch học</p><h1>Calendar</h1></div><button class="btn primary" data-action="new-plan">+ Tạo lịch</button></div>
        <div class="calendar-card">
          <div class="calendar-toolbar"><button class="icon-btn" id="prevMonth">‹</button><h2 id="monthTitle"></h2><button class="icon-btn" id="nextMonth">›</button></div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
        <div id="selectedDay" class="selected-day"></div>
      </section>

      <section id="view-plans" class="view">
        <div class="page-head"><div><p class="eyebrow">Quản lý</p><h1>Study Plans</h1></div><button class="btn primary" data-action="new-plan">+ Tạo lịch</button></div>
        <div id="plansList"></div>
      </section>

      <section id="view-settings" class="view">
        <div class="page-head"><div><p class="eyebrow">Cá nhân hóa</p><h1>Cài đặt</h1></div></div>
        <div class="settings-stack">
          <article class="card setting-row"><div><h3>Thông báo trình duyệt</h3><p id="notificationStatus">Kiểm tra quyền thông báo của trình duyệt.</p></div><button id="requestNotify" class="btn secondary">Cho phép</button></article>
          <article class="card setting-row"><div><h3>Nhắc trước</h3><p>Áp dụng cho lịch mới.</p></div><select id="defaultReminder" class="select"><option value="0">Đúng giờ</option><option value="10">10 phút</option><option value="30">30 phút</option><option value="60">1 giờ</option></select></article>
          <article class="card"><h3>Dữ liệu</h3><p class="muted">Dữ liệu hiện được lưu trực tiếp trên thiết bị này.</p><div class="button-row"><button id="exportData" class="btn secondary">Xuất dữ liệu</button><label class="btn secondary file-btn">Nhập dữ liệu<input id="importData" type="file" accept="application/json" hidden></label><button id="resetData" class="btn danger">Xóa tất cả</button></div></article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Điều hướng">
      <button class="nav-item active" data-view="today"><span>⌂</span><small>Hôm nay</small></button>
      <button class="nav-item" data-view="calendar"><span>▦</span><small>Lịch</small></button>
      <button class="nav-item" data-view="plans"><span>☷</span><small>Kế hoạch</small></button>
      <button class="nav-item" data-view="settings"><span>⚙</span><small>Cài đặt</small></button>
    </nav>
  </div>

  <dialog id="planDialog">
    <form id="planForm" method="dialog" class="modal-card">
      <div class="modal-head"><div><p class="eyebrow">Kế hoạch mới</p><h2>Tạo lịch ôn</h2></div><button type="button" class="icon-btn" data-close>×</button></div>
      <input type="hidden" id="planId" />
      <label>Tên nội dung<input id="planTitle" required placeholder="VD: Minna no Nihongo - Lesson 15" /></label>
      <label>Ghi chú<textarea id="planDescription" rows="3" placeholder="Không bắt buộc"></textarea></label>
      <div class="form-grid"><label>Ngày bắt đầu<input id="planDate" type="date" required /></label><label>Giờ ôn<input id="planTime" type="time" required /></label></div>
      <label>Khoảng cách ôn</label>
      <div id="intervals" class="intervals"></div>
      <button type="button" id="addInterval" class="btn ghost full">+ Thêm khoảng cách</button>
      <label class="check-row"><input id="planNotify" type="checkbox" checked /> Bật nhắc thông báo cho lịch này</label>
      <div class="modal-actions"><button type="button" class="btn secondary" data-close>Hủy</button><button class="btn primary" type="submit">Lưu kế hoạch</button></div>
    </form>
  </dialog>

  <dialog id="sessionDialog">
    <div class="modal-card"><div class="modal-head"><div><p class="eyebrow">Study session</p><h2 id="sessionTitle"></h2></div><button class="icon-btn" data-close>×</button></div><p id="sessionInfo" class="muted"></p><div class="modal-actions"><button id="sessionSkip" class="btn danger">Bỏ qua</button><button id="sessionSnooze" class="btn secondary">Hoãn</button><button id="sessionComplete" class="btn primary">✓ Hoàn thành</button></div></div>
  </dialog>

  <div id="toast" class="toast"></div>
  

<script>
const KEY='studyReminder.v1';
const defaultState={plans:[],sessions:[],settings:{reminder:10}};
let state=load();
let calendarDate=new Date(); calendarDate.setDate(1);
let selectedSessionId=null;
let deferredInstall=null;

const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); renderAll()}
function uid(p='id'){return p+'_'+crypto.randomUUID().slice(0,8)}
function dateKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function todayKey(){return dateKey(new Date())}
function fmtDate(d,opts={day:'2-digit',month:'2-digit',year:'numeric'}){return new Intl.DateTimeFormat('vi-VN',opts).format(new Date(d))}
function fmtTime(d){return new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function localDateTime(date,time){return new Date(`${date}T${time}:00`)}
function sessionStatus(s){if(s.status!=='pending')return s.status; return new Date(s.scheduled_at)<new Date()?'overdue':'pending'}
function planFor(s){return state.plans.find(p=>p.id===s.plan_id)}

function renderAll(){renderToday();renderCalendar();renderPlans();renderSettings();updateNotificationStatus();applyTheme()}
function renderToday(){
  const now=new Date(), today=dateKey(now);
  $('#todayLabel').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
  const todaySessions=state.sessions.filter(s=>dateKey(s.scheduled_at)===today);
  const overdue=state.sessions.filter(s=>sessionStatus(s)==='overdue');
  const completed=todaySessions.filter(s=>s.status==='completed').length;
  $('#todaySummary').innerHTML=`<div class="summary"><div class="number">${todaySessions.filter(s=>s.status==='pending').length}</div><div class="label">Cần ôn hôm nay</div></div><div class="summary"><div class="number">${completed}</div><div class="label">Đã hoàn thành</div></div><div class="summary"><div class="number">${overdue.length}</div><div class="label">Quá hạn</div></div>`;
  const pending=todaySessions.filter(s=>s.status==='pending').sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at));
  const late=overdue.sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at));
  let html='';
  if(late.length){html+=`<div class="section-title"><h2 class="overdue-heading">Quá hạn</h2><span class="muted">${late.length}</span></div><div class="session-list">${late.map(sessionHtml).join('')}</div>`}
  html+=`<div class="section-title"><h2>Hôm nay</h2><span class="muted">${todaySessions.length} sessions</span></div>`;
  html+=pending.length?`<div class="session-list">${pending.map(sessionHtml).join('')}</div>`:`<div class="empty">🎉 Không còn lịch ôn nào cần làm hôm nay.</div>`;
  $('#todayContent').innerHTML=html;
}
function sessionHtml(s){const p=planFor(s);if(!p)return '';const st=sessionStatus(s);return `<article class="session"><span class="status-dot ${st==='completed'?'done':st==='overdue'?'overdue':''}"></span><div class="session-main"><div class="session-title">${escapeHtml(p.title)}</div><div class="session-meta">Ôn lần ${s.review_number} · ${fmtTime(s.scheduled_at)}${st==='overdue'?' · Quá hạn':''}</div></div><div class="session-actions">${s.status==='pending'?`<button class="btn primary" data-session="${s.id}" data-op="complete">✓</button><button class="btn secondary" data-session="${s.id}" data-op="snooze">Hoãn</button>`:`<span class="muted">Đã xong</span>`}</div></article>`}

function renderCalendar(){
 const y=calendarDate.getFullYear(),m=calendarDate.getMonth(); $('#monthTitle').textContent=new Intl.DateTimeFormat('vi-VN',{month:'long',year:'numeric'}).format(calendarDate);
 const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), start=(first.getDay()+6)%7;
 let html=['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="weekday">${x}</div>`).join('');
 for(let i=0;i<start;i++)html+=`<div class="day muted"></div>`;
 for(let d=1;d<=days;d++){const date=new Date(y,m,d);const key=dateKey(date);const ss=state.sessions.filter(s=>dateKey(s.scheduled_at)===key);const badges=ss.slice(0,3).map(s=>`<span class="day-badge ${sessionStatus(s)==='overdue'?'overdue':s.status==='completed'?'done':''}">${escapeHtml(planFor(s)?.title||'')} ${s.status==='completed'?'✓':fmtTime(s.scheduled_at)}</span>`).join('');html+=`<div class="day ${key===todayKey()?'today':''}" data-day="${key}"><div class="day-num">${d}</div><div class="day-badges">${badges}${ss.length>3?`<span class="day-badge">+${ss.length-3}</span>`:''}</div></div>`}
 $('#calendarGrid').innerHTML=html; $$('.day[data-day]').forEach(el=>el.onclick=()=>showDay(el.dataset.day)); showDay(dateKey(new Date(y,m,Math.min(new Date().getDate(),days))));
}
function showDay(key){const ss=state.sessions.filter(s=>dateKey(s.scheduled_at)===key).sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at));$('#selectedDay').innerHTML=`<div class="section-title"><h2>${fmtDate(key,{weekday:'long',day:'numeric',month:'long'})}</h2><span class="muted">${ss.length} sessions</span></div>${ss.length?`<div class="session-list">${ss.map(sessionHtml).join('')}</div>`:`<div class="empty">Không có lịch ôn.</div>`}`}

function renderPlans(){const box=$('#plansList');if(!state.plans.length){box.innerHTML='<div class="empty">Chưa có kế hoạch nào.<br><br><button class="btn primary" data-action="new-plan">+ Tạo lịch ôn đầu tiên</button></div>';return}box.innerHTML=`<div class="plan-list">${state.plans.map(p=>{const ss=state.sessions.filter(s=>s.plan_id===p.id),done=ss.filter(s=>s.status==='completed').length;return `<article class="card plan"><div class="plan-info"><div class="plan-title">${escapeHtml(p.title)}</div><p class="plan-description">${escapeHtml(p.description||'')}</p><div class="plan-meta">Bắt đầu ${fmtDate(p.start_date)} · ${ss.length} lần ôn · ${done} hoàn thành · Mỗi lần lúc ${p.time}</div></div><div class="plan-actions"><button class="btn secondary" data-plan="${p.id}" data-op="edit">Sửa</button><button class="btn danger" data-plan="${p.id}" data-op="delete">Xóa</button></div></article>`}).join('')}</div>`}
function renderSettings(){ $('#defaultReminder').value=String(state.settings.reminder??10) }
function updateNotificationStatus(){if(!('Notification'in window)){$('#notificationStatus').textContent='Trình duyệt này không hỗ trợ notification.';$('#requestNotify').disabled=true;return}const p=Notification.permission;$('#notificationStatus').textContent=p==='granted'?'Đã cho phép thông báo.':p==='denied'?'Đã bị chặn — hãy bật lại trong cài đặt trình duyệt.':'Chưa cấp quyền thông báo.';$('#requestNotify').textContent=p==='granted'?'Đã bật':'Cho phép'}
function applyTheme(){document.documentElement.dataset.theme='dark'}

function openPlan(plan=null){const f=$('#planForm');f.reset();$('#planId').value=plan?.id||'';$('#planTitle').value=plan?.title||'';$('#planDescription').value=plan?.description||'';$('#planDate').value=plan?.start_date||todayKey();$('#planTime').value=plan?.time||'20:00';$('#planNotify').checked=plan?.notification_enabled??true;const ints=plan?.intervals||[1,3,7,14,30];$('#intervals').innerHTML='';ints.forEach(addInterval);$('#planDialog').showModal()}
function addInterval(v=7){const row=document.createElement('div');row.className='interval-row';row.innerHTML=`<input type="number" min="1" value="${v}" aria-label="Số ngày"><span class="muted">ngày</span><button type="button" aria-label="Xóa">×</button>`;row.querySelector('button').onclick=()=>row.remove();$('#intervals').appendChild(row)}
function savePlan(e){e.preventDefault();const id=$('#planId').value||uid('plan');const intervals=$$('#intervals input').map(x=>Number(x.value)).filter(n=>Number.isFinite(n)&&n>0);if(!intervals.length){toast('Cần ít nhất một khoảng cách ôn');return}intervals.sort((a,b)=>a-b);const old=state.plans.find(p=>p.id===id);const p={id,title:$('#planTitle').value.trim(),description:$('#planDescription').value.trim(),start_date:$('#planDate').value,time:$('#planTime').value,intervals,notification_enabled:$('#planNotify').checked,created_at:old?.created_at||new Date().toISOString(),updated_at:new Date().toISOString()};if(!p.title){toast('Hãy nhập tên nội dung');return}if(old){state.plans=state.plans.map(x=>x.id===id?p:x);state.sessions=state.sessions.filter(s=>s.plan_id!==id)}else state.plans.push(p);generateSessions(p);$('#planDialog').close();save();toast(old?'Đã cập nhật lịch':'Đã tạo lịch ôn')}
function generateSessions(p){let base=localDateTime(p.start_date,p.time);const times=[base];let current=base;for(const days of p.intervals){current=new Date(current.getTime()+days*86400000);times.push(current)}times.forEach((d,i)=>state.sessions.push({id:uid('session'),plan_id:p.id,review_number:i+1,scheduled_at:d.toISOString(),original_scheduled_at:d.toISOString(),status:'pending',created_at:new Date().toISOString()}))}

function openSession(id){selectedSessionId=id;const s=state.sessions.find(x=>x.id===id),p=planFor(s);if(!s||!p)return;$('#sessionTitle').textContent=p.title;$('#sessionInfo').textContent=`Ôn lần ${s.review_number} · ${fmtDate(s.scheduled_at,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} lúc ${fmtTime(s.scheduled_at)}`;$('#sessionDialog').showModal()}
function sessionOp(op){const s=state.sessions.find(x=>x.id===selectedSessionId);if(!s)return;if(op==='complete'){s.status='completed';s.completed_at=new Date().toISOString();toast('Đã đánh dấu hoàn thành')}else if(op==='skip'){s.status='skipped';toast('Đã bỏ qua lần ôn')}else if(op==='snooze'){const d=new Date(s.scheduled_at);d.setDate(d.getDate()+1);s.scheduled_at=d.toISOString();s.status='pending';toast('Đã chuyển sang ngày mai')}$('#sessionDialog').close();save()}
function deletePlan(id){const p=state.plans.find(x=>x.id===id);if(!p)return;if(!confirm(`Xóa kế hoạch “${p.title}” và toàn bộ lịch của nó?`))return;state.plans=state.plans.filter(x=>x.id!==id);state.sessions=state.sessions.filter(x=>x.plan_id!==id);save();toast('Đã xóa kế hoạch')}

function showView(v){$$('.view').forEach(x=>x.classList.toggle('active',x.id===`view-${v}`));$$('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===v));renderAll()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function notifyDue(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();state.sessions.filter(s=>s.status==='pending'&&planFor(s)?.notification_enabled).forEach(s=>{const p=planFor(s);const reminder=(p.reminder??state.settings.reminder??0)*60000;const target=new Date(s.scheduled_at).getTime()-reminder;if(now>=target&&now<target+60000){const key='notified:'+s.id; if(!localStorage.getItem(key)){new Notification('Study Reminder',{body:`${p.title} — đến giờ ôn.`});localStorage.setItem(key,'1')}}})}

$$('.nav-item').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$$('[data-action="new-plan"]').forEach(b=>b.onclick=()=>openPlan());
$('#planForm').onsubmit=savePlan;$('#addInterval').onclick=()=>addInterval();$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#prevMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};$('#nextMonth').onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};
$('#sessionComplete').onclick=()=>sessionOp('complete');$('#sessionSkip').onclick=()=>sessionOp('skip');$('#sessionSnooze').onclick=()=>sessionOp('snooze');
$('#defaultReminder').onchange=e=>{state.settings.reminder=Number(e.target.value);save()};
$('#requestNotify').onclick=async()=>{if('Notification'in window){await Notification.requestPermission();updateNotificationStatus();if(Notification.permission==='granted')toast('Đã bật thông báo')}};
$('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`study-reminder-${todayKey()}.json`;a.click();URL.revokeObjectURL(a.href)};
$('#importData').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.plans)||!Array.isArray(x.sessions))throw Error();state=x;save();toast('Đã nhập dữ liệu')}catch{toast('File dữ liệu không hợp lệ')}};r.readAsText(file)};
$('#resetData').onclick=()=>{if(confirm('Xóa toàn bộ kế hoạch và lịch ôn trên thiết bị này?')){state=structuredClone(defaultState);save();toast('Đã xóa dữ liệu')}};
document.addEventListener('click',e=>{const s=e.target.closest('[data-session]');if(s){openSession(s.dataset.session);return}const p=e.target.closest('[data-plan]');if(p){const plan=state.plans.find(x=>x.id===p.dataset.plan);if(p.dataset.op==='edit')openPlan(plan);if(p.dataset.op==='delete')deletePlan(p.dataset.plan)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();deferredInstall=null;$('#installBtn').classList.add('hidden')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
renderAll();setInterval(notifyDue,30000);notifyDue();

</script>
</body>
</html>
